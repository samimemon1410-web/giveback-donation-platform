<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GiveBack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">GiveBack</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="donate.html">Donate</a></li>
            <li><a href="my-donations.html">My Donations</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html" class="nav-cta">Register</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Create Your Account</h2>

        <form id="registerForm">
            <label for="role">I am a</label>
            <select id="role" name="role" required>
                <option value="donor">Donor</option>
                <option value="ngo">NGO / Beneficiary</option>
            </select>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit number" required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Your address" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6"
                required>

            <button type="submit">Register</button>
        </form>

        <p id="message" class="form-note"></p>
        <p class="form-note">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <footer>© 2026 GiveBack · Donation & Reuse Platform</footer>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const data = {
                role: document.getElementById("role").value,
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                address: document.getElementById("address").value,
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                message.textContent = result.message;

                if (response.ok) {
                    message.className = "form-note msg-success";
                    form.reset();
                    setTimeout(function () {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    message.className = "form-note msg-error";
                }
            } catch (error) {
                message.textContent = "Cannot reach the server. Is it running?";
                message.className = "form-note msg-error";
            }
        });
    </script>

</body>

</html>
