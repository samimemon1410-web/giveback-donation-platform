<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Donations - GiveBack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">GiveBack</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="donate.html">Donate</a></li>
            <li><a href="my-donations.html">My Donations</a></li>
            <li><button class="logout-btn" id="logoutBtn">Logout</button></li>
        </ul>
    </nav>

    <div class="page-container">
        <h2>My Donations</h2>
        <p class="sub" id="welcome">Your donation history and status.</p>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Qty</th>
                        <th>NGO</th>
                        <th>Pickup Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <p class="empty-note" id="emptyNote" style="display:none;">
                No donations yet. <a href="donate.html" style="color:#22c55e;">Make your first donation</a>
            </p>
        </div>
    </div>

    <footer>© 2026 GiveBack · Donation & Reuse Platform</footer>

    <script>
        const API = "";
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");

        if (!token) {
            window.location.href = "login.html";
        }

        if (user) {
            document.getElementById("welcome").textContent = "Hello, " + user.name + ". Here is your donation history.";
        }

        document.getElementById("logoutBtn").addEventListener("click", function () {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        });

        function addCell(row, text) {
            const cell = document.createElement("td");
            cell.textContent = text;
            row.appendChild(cell);
        }

        async function loadDonations() {
            const tableBody = document.getElementById("tableBody");
            const emptyNote = document.getElementById("emptyNote");

            try {
                const response = await fetch(API + "/api/donations/my", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (response.status === 401) {
                    localStorage.removeItem("token");
                    window.location.href = "login.html";
                    return;
                }

                const donations = await response.json();

                if (donations.length === 0) {
                    emptyNote.style.display = "block";
                    return;
                }

                donations.forEach(function (d) {
                    const row = document.createElement("tr");
                    addCell(row, d.category);
                    addCell(row, d.quantity);
                    addCell(row, d.ngoName);
                    addCell(row, d.pickupDate);

                    const statusCell = document.createElement("td");
                    const badge = document.createElement("span");
                    badge.className = "status status-" + d.status;
                    badge.textContent = d.status;
                    statusCell.appendChild(badge);
                    row.appendChild(statusCell);

                    tableBody.appendChild(row);
                });
            } catch (error) {
                emptyNote.textContent = "Cannot reach the server. Is it running?";
                emptyNote.style.display = "block";
            }
        }

        loadDonations();
    </script>

</body>

</html>
